<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Lichess Bot</title>
<style>
  :root { color-scheme: dark; }
  body {
    background: #14161a;
    color: #e8e8e8;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .card { text-align: center; max-width: 460px; padding: 24px; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #333; border-top-color: #7cb342;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error {
    color: #ff6b6b;
    white-space: pre-wrap;
    text-align: left;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    margin-top: 16px;
    background: #1e1414;
    border-radius: 6px;
    padding: 10px;
  }
  button {
    margin-top: 16px;
    padding: 8px 18px;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid #555;
    background: #24262b;
    color: inherit;
    font-size: 14px;
  }
  button:hover { background: #2e3138; }
</style>
</head>
<body>
<div class="card">
  <div class="spinner" id="spinner"></div>
  <div id="status">Création de la partie…</div>
  <div class="error" id="error" style="display:none"></div>
  <div id="debugParams" style="font-family:ui-monospace,monospace;font-size:11px;opacity:0.5;margin-top:14px;word-break:break-all;"></div>
  <button id="closeBtn" style="display:none" onclick="window.close()">Fermer</button>
</div>
<script>
// This page exists because curl, spawned as a child of Quickshell's
// Process, reliably produced a request Lichess treated as bodyless (byte-
// for-byte identical to a working one when captured with curl's own
// --trace-ascii — the discrepancy showed up somewhere between curl and
// the server, not in the bytes curl believed it sent) even though the
// exact same request worked from an interactive shell. A real browser's
// own fetch() is a completely different network stack and process
// ancestry, sidestepping whatever that was. Lichess's API sends
// `Access-Control-Allow-Origin: *`, so a fetch() from this file:// page
// to https://lichess.org is allowed.
//
// Config arrives via the URL fragment (not a query string) so it's not
// sent to any server and doesn't appear in a request log — though it is
// visible in this window's process argv (`ps`) and browser history, the
// same trade-off already documented for the plugin's token handling.

function readParams() {
  var hash = location.hash.replace(/^#/, "")
  var params = {}
  hash.split("&").forEach(function(kv) {
    if (!kv) return
    var i = kv.indexOf("=")
    var key = decodeURIComponent(kv.substring(0, i))
    var value = decodeURIComponent(kv.substring(i + 1))
    params[key] = value
  })
  return params
}

function showStatus(text) {
  document.getElementById("status").textContent = text
}

function showError(message) {
  document.getElementById("spinner").style.display = "none"
  document.getElementById("status").textContent = "Échec."
  var errEl = document.getElementById("error")
  errEl.style.display = "block"
  errEl.textContent = message
  document.getElementById("closeBtn").style.display = "inline-block"
}

function errorDetail(json, status) {
  if (json && json.error) {
    return typeof json.error === "string" ? json.error : JSON.stringify(json.error)
  }
  return "HTTP " + status
}

// ---- Mode "ai": one POST, the response carries the new game's id. ----
function aiFlow(params) {
  var body = new URLSearchParams()
  body.set("level", params.level || "3")
  body.set("color", params.color || "random")
  body.set("variant", "standard")
  if (params.clockLimit) {
    body.set("clock.limit", params.clockLimit)
    body.set("clock.increment", params.clockIncrement || "0")
  } else if (params.days) {
    body.set("days", params.days)
  }

  fetch("https://lichess.org/api/challenge/ai", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + params.token,
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: body.toString()
  })
    .then(function(res) {
      return res.json()
        .catch(function() { return null })
        .then(function(json) { return { ok: res.ok, status: res.status, json: json } })
    })
    .then(function(result) {
      if (result.ok && result.json && result.json.id) {
        window.location.href = "https://lichess.org/" + result.json.id
      } else {
        showError(errorDetail(result.json, result.status))
      }
    })
    .catch(function(err) { showError(String(err)) })
}

// ---- Modes "casual"/"rated": POST /api/board/seek stays open
// (streaming) until matched, and never reports a game id itself — the
// API docs say to keep the account event stream open in parallel and
// watch for a "gameStart" event there. Both requests are plain fetch()
// streams; there's no polling involved.
//
// Only Rapid and Correspondence clocks are accepted here — confirmed
// empirically against the live API, since Bullet/Blitz both failed with
// "Invalid time control" even in an otherwise-minimal seek request; the
// settings panel only offers those two cadences for these modes. ----
function humanFlow(params) {
  showStatus("Recherche d'un adversaire de ton niveau…")

  var matched = false
  var stopped = false
  var seekAbort = new AbortController()
  var eventAbort = new AbortController()

  var giveUpAfterMs = 5 * 60 * 1000
  var giveUpTimer = setTimeout(function() {
    if (!matched) fail("Personne n'a été trouvé après 5 minutes. Réessaie plus tard, ou élargis la cadence.")
  }, giveUpAfterMs)

  // Single failure path for both legs: whichever one breaks, the other
  // is aborted too, so a working seek never keeps running unmonitored
  // just because the event stream (the only thing that can tell us a
  // match happened) failed — that would leave a live seek nobody is
  // watching, and a real opponent could get paired with no way for this
  // page to redirect to the game.
  function fail(message) {
    if (matched || stopped) return
    stopped = true
    clearTimeout(giveUpTimer)
    seekAbort.abort()
    eventAbort.abort()
    console.error("lichess-bot human mode failed:", message)
    showError(message + "\n\nLa recherche d'adversaire a été annulée — cette fenêtre ne créera pas de partie.")
  }

  function onMatched(gameId) {
    if (matched || stopped) return
    matched = true
    clearTimeout(giveUpTimer)
    window.location.href = "https://lichess.org/" + gameId
  }

  // Drains a streaming Response body, calling onLine(text) for every
  // complete line. Resolves once the stream ends (matched, cancelled, or
  // the connection dropped).
  function pumpLines(response, onLine) {
    var reader = response.body.getReader()
    var decoder = new TextDecoder()
    var buffer = ""
    function step() {
      return reader.read().then(function(r) {
        if (r.done) return
        buffer += decoder.decode(r.value, { stream: true })
        var lines = buffer.split("\n")
        buffer = lines.pop()
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim()
          if (line) onLine(line)
        }
        if (matched || stopped) return
        return step()
      })
    }
    return step()
  }

  var seekBody = new URLSearchParams()
  seekBody.set("rated", params.rated === "true" ? "true" : "false")
  if (params.ratingMin && params.ratingMax) {
    seekBody.set("ratingRange", params.ratingMin + "-" + params.ratingMax)
  }
  if (params.color) seekBody.set("color", params.color)
  if (params.days) {
    seekBody.set("days", params.days)
  } else {
    seekBody.set("time", params.time || "5")
    seekBody.set("increment", params.increment || "3")
  }

  // Both legs report in here so the status line always reflects the
  // furthest either one has gotten, instead of silently sitting on the
  // initial "Recherche…" message if one leg is stuck or slow.
  var seekState = "connecting" // connecting | open
  var eventState = "connecting"
  function refreshStatus() {
    if (matched || stopped) return
    if (seekState === "connecting" || eventState === "connecting") {
      showStatus("Connexion à lichess.org…")
    } else {
      showStatus("Recherche d'un adversaire de ton niveau… (les deux connexions sont ouvertes)")
    }
  }

  // The seek itself: stays open, sends periodic empty lines, and closes
  // with no data once paired. We don't need anything it sends — just
  // keep reading so the connection (and therefore the seek) stays alive
  // until matched or this page goes away.
  fetch("https://lichess.org/api/board/seek", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + params.token,
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: seekBody.toString(),
    signal: seekAbort.signal
  })
    .then(function(res) {
      if (!res.ok) {
        return res.json().catch(function() { return null }).then(function(json) {
          fail("Recherche d'adversaire refusée : " + errorDetail(json, res.status))
        })
      }
      seekState = "open"
      refreshStatus()
      return pumpLines(res, function() { /* keep-alive lines, ignored */ })
    })
    .catch(function(err) {
      if (err && err.name === "AbortError") return // our own cleanup, not a real failure
      fail("Recherche d'adversaire : " + String(err))
    })

  // The account event stream: this is what actually tells us a game
  // started, and which one.
  fetch("https://lichess.org/api/stream/event", {
    headers: { "Authorization": "Bearer " + params.token },
    signal: eventAbort.signal
  })
    .then(function(res) {
      if (!res.ok) {
        fail("Flux d'évènements refusé (HTTP " + res.status + "). Vérifie que le token a bien le scope board:play — régénère-en un si besoin.")
        return
      }
      eventState = "open"
      refreshStatus()
      return pumpLines(res, function(line) {
        var evt
        try { evt = JSON.parse(line) } catch (e) { return }
        if (evt.type === "gameStart" && evt.game && evt.game.id) onMatched(evt.game.id)
      })
    })
    .catch(function(err) {
      if (err && err.name === "AbortError") return
      fail("Flux d'évènements : " + String(err))
    })
}

var params = readParams()

// TEMP DEBUG: show exactly what this page parsed, right on the page
// itself — no devtools needed to see which branch is about to run.
// Token redacted since it's not relevant to this diagnostic.
document.getElementById("debugParams").textContent =
  "mode reçu : " + JSON.stringify(params.mode) +
  " — hash brut : " + location.hash.replace(/token=[^&]*/, "token=<redacted>")

if (!params.token) {
  showError("Aucun token fourni.")
} else if (params.mode === "casual" || params.mode === "rated") {
  humanFlow(params)
} else {
  aiFlow(params)
}
</script>
</body>
</html>
