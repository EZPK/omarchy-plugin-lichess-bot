<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Lichess Bot</title>
<style>
  :root { color-scheme: dark; }
  body {
    background: #14161a;
    color: #e8e8e8;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .card { text-align: center; max-width: 460px; padding: 24px; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #333; border-top-color: #7cb342;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error {
    color: #ff6b6b;
    white-space: pre-wrap;
    text-align: left;
    font-family: ui-monospace, monospace;
    font-size: 13px;
    margin-top: 16px;
    background: #1e1414;
    border-radius: 6px;
    padding: 10px;
  }
  button {
    margin-top: 16px;
    padding: 8px 18px;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid #555;
    background: #24262b;
    color: inherit;
    font-size: 14px;
  }
  button:hover { background: #2e3138; }
</style>
</head>
<body>
<div class="card">
  <div class="spinner" id="spinner"></div>
  <div id="status">Création de la partie…</div>
  <div class="error" id="error" style="display:none"></div>
  <button id="closeBtn" style="display:none" onclick="window.close()">Fermer</button>
</div>
<script>
// This page exists because curl, spawned as a child of Quickshell's
// Process, reliably produced a request Lichess treated as bodyless (byte-
// for-byte identical to a working one when captured with curl's own
// --trace-ascii — the discrepancy showed up somewhere between curl and
// the server, not in the bytes curl believed it sent) even though the
// exact same request worked from an interactive shell. A real browser's
// own fetch() is a completely different network stack and process
// ancestry, sidestepping whatever that was. Lichess's API sends
// `Access-Control-Allow-Origin: *`, so a fetch() from this file:// page
// to https://lichess.org is allowed.
//
// Config arrives via the URL fragment (not a query string) so it's not
// sent to any server and doesn't appear in a request log — though it is
// visible in this window's process argv (`ps`) and browser history, the
// same trade-off already documented for the plugin's token handling.

function readParams() {
  var hash = location.hash.replace(/^#/, "")
  var params = {}
  hash.split("&").forEach(function(kv) {
    if (!kv) return
    var i = kv.indexOf("=")
    var key = decodeURIComponent(kv.substring(0, i))
    var value = decodeURIComponent(kv.substring(i + 1))
    params[key] = value
  })
  return params
}

function showError(message) {
  document.getElementById("spinner").style.display = "none"
  document.getElementById("status").textContent = "Échec de la création de la partie."
  var errEl = document.getElementById("error")
  errEl.style.display = "block"
  errEl.textContent = message
  document.getElementById("closeBtn").style.display = "inline-block"
}

var params = readParams()

if (!params.token) {
  showError("Aucun token fourni.")
} else {
  var body = new URLSearchParams()
  body.set("level", params.level || "3")
  body.set("color", params.color || "random")
  body.set("variant", "standard")
  if (params.clockLimit) {
    body.set("clock.limit", params.clockLimit)
    body.set("clock.increment", params.clockIncrement || "0")
  } else if (params.days) {
    body.set("days", params.days)
  }

  fetch("https://lichess.org/api/challenge/ai", {
    method: "POST",
    headers: {
      "Authorization": "Bearer " + params.token,
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: body.toString()
  })
    .then(function(res) {
      return res.json()
        .catch(function() { return null })
        .then(function(json) { return { ok: res.ok, status: res.status, json: json } })
    })
    .then(function(result) {
      if (result.ok && result.json && result.json.id) {
        window.location.href = "https://lichess.org/" + result.json.id
      } else {
        var detail = result.json && result.json.error
          ? (typeof result.json.error === "string" ? result.json.error : JSON.stringify(result.json.error))
          : ("HTTP " + result.status)
        showError(detail)
      }
    })
    .catch(function(err) {
      showError(String(err))
    })
}
</script>
</body>
</html>
